name: homelab-monitor

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: homelab-monitor-api:local
    env_file:
      - path: .env
        required: false
    environment:
      HOMELAB_ENVIRONMENT: ${HOMELAB_ENVIRONMENT:-production}
      HOMELAB_DATABASE_URL: sqlite:////var/lib/homelab-monitor/homelab-monitor.db
      HOMELAB_LOG_DIR: /var/log/homelab-monitor
      HOMELAB_LOG_LEVEL: ${HOMELAB_LOG_LEVEL:-INFO}
      HOMELAB_REGISTRATION_KEY: ${HOMELAB_REGISTRATION_KEY}
      HOMELAB_JWT_SECRET: ${HOMELAB_JWT_SECRET}
      HOMELAB_JWT_EXPIRE_MINUTES: ${HOMELAB_JWT_EXPIRE_MINUTES:-60}
      HOMELAB_BOOTSTRAP_ADMIN_PASSWORD: ${HOMELAB_BOOTSTRAP_ADMIN_PASSWORD:-}
      HOMELAB_BOOTSTRAP_OPERATOR_PASSWORD: ${HOMELAB_BOOTSTRAP_OPERATOR_PASSWORD:-}
      HOMELAB_BOOTSTRAP_VIEWER_PASSWORD: ${HOMELAB_BOOTSTRAP_VIEWER_PASSWORD:-}
      HOMELAB_AGENT_REPORT_INTERVAL_SECONDS: ${HOMELAB_AGENT_REPORT_INTERVAL_SECONDS:-60}
      HOMELAB_MINIMUM_AGENT_VERSION: ${HOMELAB_MINIMUM_AGENT_VERSION:-0.1.0}
      HOMELAB_LATEST_AGENT_VERSION: ${HOMELAB_LATEST_AGENT_VERSION:-0.1.0}
      HOMELAB_ALERT_CPU_THRESHOLD_PERCENT: ${HOMELAB_ALERT_CPU_THRESHOLD_PERCENT:-90}
      HOMELAB_ALERT_MEMORY_THRESHOLD_PERCENT: ${HOMELAB_ALERT_MEMORY_THRESHOLD_PERCENT:-90}
      HOMELAB_ALERT_DISK_THRESHOLD_PERCENT: ${HOMELAB_ALERT_DISK_THRESHOLD_PERCENT:-90}
      HOMELAB_ALERT_TEMPERATURE_THRESHOLD_CELSIUS: ${HOMELAB_ALERT_TEMPERATURE_THRESHOLD_CELSIUS:-85}
      HOMELAB_AGENT_OFFLINE_AFTER_SECONDS: ${HOMELAB_AGENT_OFFLINE_AFTER_SECONDS:-180}
      HOMELAB_ALERT_EVALUATION_INTERVAL_SECONDS: ${HOMELAB_ALERT_EVALUATION_INTERVAL_SECONDS:-30}
      HOMELAB_FORWARDED_ALLOW_IPS: ${HOMELAB_FORWARDED_ALLOW_IPS:-*}
      HOMELAB_DASHBOARD_HEALTH_URL: ${HOMELAB_DASHBOARD_HEALTH_URL:-http://dashboard:8080/}
      HOMELAB_API_HEALTH_URL: ${HOMELAB_API_HEALTH_URL:-http://api:8000/health}
      HOMELAB_DASHBOARD_PUBLIC_URL: ${HOMELAB_DASHBOARD_PUBLIC_URL:-}
      HOMELAB_IMMICH_PUBLIC_URL: ${HOMELAB_IMMICH_PUBLIC_URL:-}
      HOMELAB_QNAP_PUBLIC_URL: ${HOMELAB_QNAP_PUBLIC_URL:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_REQUEST_TIMEOUT: ${TELEGRAM_REQUEST_TIMEOUT:-10}
      HOMELAB_TELEGRAM_ENABLED: ${HOMELAB_TELEGRAM_ENABLED:-false}
      HOMELAB_NOTIFICATION_WORKER_ENABLED: ${HOMELAB_NOTIFICATION_WORKER_ENABLED:-true}
      HOMELAB_INFRASTRUCTURE_MOCK: ${HOMELAB_INFRASTRUCTURE_MOCK:-true}
      HOMELAB_INFRASTRUCTURE_REFRESH_SECONDS: ${HOMELAB_INFRASTRUCTURE_REFRESH_SECONDS:-30}
      HOMELAB_INFRASTRUCTURE_TIMEOUT_SECONDS: ${HOMELAB_INFRASTRUCTURE_TIMEOUT_SECONDS:-2}
      HOMELAB_QNAP_URL: ${HOMELAB_QNAP_URL:-}
      HOMELAB_QNAP_USERNAME: ${HOMELAB_QNAP_USERNAME:-}
      HOMELAB_QNAP_PASSWORD: ${HOMELAB_QNAP_PASSWORD:-}
      HOMELAB_QNAP_SID: ${HOMELAB_QNAP_SID:-}
      HOMELAB_QNAP_TLS_VERIFY: ${HOMELAB_QNAP_TLS_VERIFY:-true}
      HOMELAB_QNAP_TIMEOUT_SECONDS: ${HOMELAB_QNAP_TIMEOUT_SECONDS:-10}
      HOMELAB_DOCKER_URL: ${HOMELAB_DOCKER_URL:-}
      HOMELAB_IMMICH_URL: ${HOMELAB_IMMICH_URL:-}
      HOMELAB_IMMICH_API_KEY: ${HOMELAB_IMMICH_API_KEY:-}
      HOMELAB_QUMAGIE_URL: ${HOMELAB_QUMAGIE_URL:-}
      HOMELAB_QUMAGIE_API_KEY: ${HOMELAB_QUMAGIE_API_KEY:-}
      HOMELAB_BACKUP_URL: ${HOMELAB_BACKUP_URL:-}
      HOMELAB_BACKUP_ENABLED: ${HOMELAB_BACKUP_ENABLED:-true}
      HOMELAB_BACKUP_PATH: ${HOMELAB_BACKUP_PATH:-/var/lib/homelab-monitor/backups}
      HOMELAB_BACKUP_RETENTION_DAILY: ${HOMELAB_BACKUP_RETENTION_DAILY:-7}
      HOMELAB_BACKUP_RETENTION_WEEKLY: ${HOMELAB_BACKUP_RETENTION_WEEKLY:-4}
      HOMELAB_BACKUP_RETENTION_MONTHLY: ${HOMELAB_BACKUP_RETENTION_MONTHLY:-6}
      HOMELAB_BACKUP_TIME: ${HOMELAB_BACKUP_TIME:-02:00}
      HOMELAB_BACKUP_TIMEZONE: ${HOMELAB_BACKUP_TIMEZONE:-Asia/Bangkok}
      HOMELAB_PHOTO_WATCH_FOLDER: ${HOMELAB_PHOTO_WATCH_FOLDER:-/data/photos}
      HOMELAB_PHOTO_WATCHER_ENABLED: ${HOMELAB_PHOTO_WATCHER_ENABLED:-true}
      HOMELAB_PHOTO_SCAN_INTERVAL_SECONDS: ${HOMELAB_PHOTO_SCAN_INTERVAL_SECONDS:-5}
    volumes:
      - homelab-data:/var/lib/homelab-monitor
      - homelab-logs:/var/log/homelab-monitor
      - /data/photos:/data/photos:ro
      - /data/photos/library-a:/data/photos/library-a:ro
      - /data/photos/library-b:/data/photos/library-b:ro
      - /data/photos/library-c:/data/photos/library-c:ro
      - /data/photos/library-d:/data/photos/library-d:ro
      - /data/photos/library-e:/data/photos/library-e:ro
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - egress

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: homelab-monitor-dashboard:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOMELAB_DASHBOARD_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /var/log/nginx:mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

volumes:
  homelab-data:
  homelab-logs:

networks:
  backend:
  egress:
