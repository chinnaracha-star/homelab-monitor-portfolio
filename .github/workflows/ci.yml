name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: API and agent quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOMELAB_REGISTRATION_KEY: ci-registration-key-at-least-24-chars
      HOMELAB_JWT_SECRET: ci-jwt-secret-key-at-least-32-characters
      HOMELAB_DATABASE_URL: sqlite:////tmp/homelab-monitor-ci.db
      HOMELAB_LOG_LEVEL: WARNING
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install ".[dev]"

      - name: Check migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

  dashboard:
    name: Dashboard quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python, dashboard]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: homelab-monitor-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=min,scope=api

      - name: Build dashboard image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: homelab-monitor-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=min,scope=dashboard
