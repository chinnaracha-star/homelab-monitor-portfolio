user www-data;
worker_processes auto;
pid /run/homelab-dashboard.pid;
error_log /var/log/nginx/homelab-dashboard.error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 4m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $scheme;
        https https;
    }

    access_log /var/log/nginx/homelab-dashboard.access.log;

    include /etc/homelab-monitor/homelab-monitor.conf;
}
